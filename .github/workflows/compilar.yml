# Compila los ejecutables de Windows, Linux y macOS en los servidores de GitHub,
# comprueba que cada uno abre la interfaz y, al publicar una versión desde la
# pestaña "Releases" de GitHub, adjunta los ejecutables a esa versión.
# También se puede ejecutar a mano desde la pestaña "Actions".
name: Compilar ejecutables

on:
  release:
    types: [published]
  workflow_dispatch:

# Permisos mínimos por defecto; solo la publicación pide escritura
permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover tests -v

  compilar:
    needs: pruebas
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --onefile --console --collect-data detector_red --name DetectorRed-${{ runner.os }} lanzador.py

      # Abre el ejecutable recién armado, comprueba que sirve la página y lo cierra.
      # Así no se publica un ejecutable al que le falte la interfaz.
      - name: Probar el ejecutable
        shell: bash
        run: |
          EXE="dist/DetectorRed-${{ runner.os }}"
          if [ "${{ runner.os }}" = "Windows" ]; then EXE="$EXE.exe"; fi
          export DETECTOR_RED_DATOS="$RUNNER_TEMP/datos"
          "$EXE" --version
          "$EXE" --sin-navegador --puerto 8799 > "$RUNNER_TEMP/servidor.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8799/ -o "$RUNNER_TEMP/pagina.html"; then break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/servidor.log"
          grep -q "<title>Detector de red</title>" "$RUNNER_TEMP/pagina.html"
          curl -sf http://127.0.0.1:8799/api/estado | grep -q '"version"'
          TOKEN=$(grep -o 'name="token" content="[^"]*"' "$RUNNER_TEMP/pagina.html" | cut -d'"' -f4)
          curl -sf -X POST -H "X-Token: $TOKEN" -H "Content-Type: application/json" \
               -d '{}' http://127.0.0.1:8799/api/apagar
          echo "El ejecutable abre la interfaz correctamente."

      # Huella SHA-256 de cada ejecutable, publicada junto a la versión
      - run: python instalador/sumas.py
      - uses: actions/upload-artifact@v4
        with:
          name: DetectorRed-${{ runner.os }}
          path: dist/*
      - name: Publicar en Releases
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
